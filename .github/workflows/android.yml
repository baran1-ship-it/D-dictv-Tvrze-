name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.6.3
      XDG_DATA_HOME: ${{ github.workspace }}/.ci-data
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-config
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          echo '/tmp/godot' >> "$GITHUB_PATH"
          ln -s "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /tmp/godot/godot
          mkdir -p "$XDG_DATA_HOME/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.zip -d /tmp/export-templates
          cp /tmp/export-templates/templates/* "$XDG_DATA_HOME/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Fetch locked CC0 PBR materials
        run: python3 tools/fetch_materials.py
      - name: Import and test project
        run: |
          set -euo pipefail
          timeout 120s godot --headless --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/import.log; then exit 1; fi
          XDG_DATA_HOME="$RUNNER_TEMP/game-test-data" timeout 180s godot --headless --script res://tests/smoke.gd 2>&1 | tee /tmp/tests.log
          grep -q 'PASS: exploration, multitouch, controller mapping, animated doors, collision, gallery and three tower floors' /tmp/tests.log
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dedictvi-signing
          key: dedictvi-exploration-debug-key-v1
      - name: Configure Android export and debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CONFIG_HOME/godot" "$RUNNER_TEMP/dedictvi-signing" build
          if [ ! -f "$RUNNER_TEMP/dedictvi-signing/debug.keystore" ]; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/dedictvi-signing/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$XDG_CONFIG_HOME/godot/editor_settings-4.6.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/dedictvi-signing/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      - name: Render review screenshots
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --path . --resolution 1280x720 --script res://tests/visual.gd 2>&1 | tee /tmp/visual.log
          test -s build/courtyard.png
          if grep -Eq 'SCRIPT ERROR:|Parse Error:' /tmp/visual.log; then exit 1; fi
      - name: Export APK
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s godot --headless --export-debug Android build/dedictvi-tvrze.apk 2>&1 | tee /tmp/export.log
          test -s build/dedictvi-tvrze.apk
      - name: Verify APK signature and package
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/dedictvi-tvrze.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/dedictvi-tvrze.apk
          sha256sum build/dedictvi-tvrze.apk > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dedictvi-tvrze-prochazka
          path: |
            build/dedictvi-tvrze.apk
            build/SHA256SUMS.txt
            build/courtyard.png
            build/door-hand.png
            build/east-wing.png
            build/roof-detail.png
            build/wall-walk.png
            build/tower-stairs.png
            build/south-door.png
            build/gallery-access.png
          if-no-files-found: error
          retention-days: 14
